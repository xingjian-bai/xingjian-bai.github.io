const PART=[[0,E0],[E0,E0+E1],[E0+E1,E0+E1+E2]],LAST=PART.length-1;
function frame(tau){const t0=Math.min(tau,E0),t1=tau-E0,t2=tau-E0-E1;
 const f=1-ease(ramp(t0,0,.4));op(leg,f);
 const g=io(ramp(t0,Z0,ZD)),v=view(g),yo=1-ease(ramp(g,.1,.4)),yn=ease(ramp(g,.38,.4));
 setN(axis,{y1:v.B,y2:v.B});
 for(const k of yT){const y=Yv(v,k.v);setN(k.e,{y:y+9});op(k.e,(k.k?yn:yo)*clamp01(1-Math.max(v.T-y,y-v.B,0)/50))}
 for(const k of xT){const x=Xv(v,k.u);setN(k.e,{x,y:v.B+lerp(38,40,g)});op(k.e,(k.k===2?1:k.k?yn:yo)*clamp01(1-(L-x)/50))}
 const c=(v.T+v.B)/2;setN(stepsT,{y:v.B+lerp(80,82,g)});setN(lossT,{y:c,transform:`rotate(-90 44 ${c})`});
 curve.setAttribute('d',runPath(v,v.x0,g>=1?PRE[0]:V0.x1-RW*g*(v.x1-v.x0)));setN($('clipR'),{y:lerp(290,200,g),height:lerp(480,600,g)}); // the closer's clip, grown with the view
 const mx=Xv(v,514);setN(mark,{x1:mx,x2:mx,y2:v.B});op(mark,.25*f);
 const sg=io(ramp(t0,SP0,SPD)),ax=Xv(V1,PRE[0]),ay=Yv(V1,PRE[1]);
 spike.setAttribute('d',`M${ax.toFixed(1)},${ay.toFixed(1)}L${lerp(ax,SX,sg).toFixed(1)},${lerp(ay,Yv(V1,SPIKE[1]),sg).toFixed(1)}`);op(spike,sg>0?1:0);
 op(dot,ease(ramp(t0,DT,.2)));
 const n=ease(ramp(t0,NOW0,FADE));op(now,n);op(nowT,n);op(future,n);
 const u=ease(ramp(t1,0,.6));SPK.over.setAttribute('stroke',mix(DARK,RED,u));SPK.lab.style.fill=mix(INK,RED,u);
 op(SPK.glow,1-u);op(SPK.lit,ease(ramp(t1,0,.3))*(1-.3*ease(ramp(t1,.35,.55))));
 op(q,ease(ramp(t2,0,FADE)));opts.forEach((o,i)=>op(o,ease(ramp(t2,T_OPT[i],FADE))))}

// ---- playing. onActive(0) plays the entry; onActive(k > 0) shows part k settled. A click plays the next part; one that
// comes while a part plays first finishes that part sped up over FF s. Past the last part (the native line) the page
// finishes what is playing the same way and holds. window.interveneState reports where it is.
let tau=0,cur=0,raf=0,seg=null;
const FF=.35,eo=x=>1-(1-x)*(1-x);
const state=()=>{let k=cur;while(k>0&&tau<PART[k][0])k--;window.interveneState={step:cur,part:k,t:+(tau-PART[k][0]).toFixed(3),tau:+tau.toFixed(3),playing:!!seg,fastForward:!!(seg&&seg.ff),ends:PART.map(p=>+p[1].toFixed(3))}};
function show(t){tau=t;frame(tau);state()}
function tick(now){const s=seg;if(!s){raf=0;return}
 if(s.at===null)s.at=now;const x=s.dur>0?clamp01((now-s.at)/1000/s.dur):1;
 show(s.from+(s.to-s.from)*(s.ff?eo(x):x));
 if(x>=1){seg=null;raf=0;if(s.then)s.then();state()}else raf=requestAnimationFrame(tick)}
function run(to,dur,ff,then){seg={from:tau,to,dur,ff,then,at:null};if(!raf)raf=requestAnimationFrame(tick);state()}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;seg=null;state()}
function playPart(k){cur=k;show(PART[k][0]);run(PART[k][1],PART[k][1]-PART[k][0],false,null)}
function settle(k){stop();cur=k;show(PART[k][1])}
function toStep(k){k=Math.max(0,k|0);
 if(k<cur){settle(k);return}
 if(k===cur)return;
 if(k>LAST){cur=LAST;if(tau<PART[LAST][1]&&!(seg&&seg.ff&&seg.to===PART[LAST][1]))run(PART[LAST][1],FF,true,null);return}
 cur=k;if(tau<PART[k][0])run(PART[k][0],FF,true,()=>playPart(k));else playPart(k)}
show(0);
window.deckSteps=LAST;
window.renderAt=(step,t)=>{stop();const s=Math.max(0,step|0),k=Math.min(s,LAST);cur=k;
 show(t==null||s>LAST?PART[k][1]:PART[k][0]+Math.max(0,Math.min(PART[k][1]-PART[k][0],+t||0)))};
const dw=window.deckwerk;
if(dw&&dw.ready&&document.fonts&&document.fonts.ready)dw.ready(document.fonts.ready);
document.addEventListener('click',()=>{if(dw)dw.next();else toStep(cur+1)});
if(dw){
 deckwerk.onActive(e=>{const s=(e&&e.step)|0;if(s>=1)settle(Math.min(s,LAST));else{stop();playPart(0)}});
 deckwerk.onStep(e=>toStep(e&&e.step));
 deckwerk.onInactive(stop);
}else playPart(0);
})();
</script></body></html>
