function post(m){m.source=SRC;if(window.parent&&window.parent!==window)window.parent.postMessage(m,'*');}

  onActive:function(f){handlers.active.push(f);},
  onInactive:function(f){handlers.inactive.push(f);},

  next:function(){post({action:'next'});},
  prev:function(){post({action:'prev'});},
  ready:function(p){

    post({action:'hold-ready'});

  }
};
window.addEventListener('message',function(e){

}else{
 fontsReady.then(()=>play(0));
 const next=()=>{if(cur<MAX)play(cur+1)};
 document.addEventListener('click',next);
 document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')next();else if(e.key==='ArrowLeft')settle(cur-1)});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stop();draw(cur,END[cur])}});
})();
