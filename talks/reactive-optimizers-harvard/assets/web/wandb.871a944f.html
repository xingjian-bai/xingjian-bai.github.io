 p.yt=p.ytl.map(s=>{const t=el('text',{class:'tk','text-anchor':'end'},g);t.textContent=s;return t});
 p.xt=XT.map(v=>{const t=el('text',{class:'tk','text-anchor':'middle'},g);t.textContent=fmtX(v);return t});
 p.xl=el('text',{class:'tk','text-anchor':'middle'},g);p.xl.textContent='Step';
 if(p.legend){
  p.lg=el('g',{},g);p.lgSw=[];p.lgTx=[];
  if(p.legend.items){for(const [name,c] of p.legend.items){p.lgSw.push(el('line',{stroke:c,'stroke-linecap':'round'},p.lg));const t=el('text',{class:'tk'},p.lg);t.textContent=name;p.lgTx.push(t)}}
  else{for(let i=0;i<p.legend.n;i++)p.lgSw.push(el('line',{stroke:PAL[i],'stroke-linecap':'round'},p.lg));const t=el('text',{class:'tk'},p.lg);t.textContent=p.legend.text;p.lgTx.push(t)}
 }
 const cp=el('clipPath',{id:'c-'+p.id},defs);p.clip=el('rect',{},cp);
 const lg=el('g',{'clip-path':'url(#c-'+p.id+')'},g);
 // the second run (run2) has its own clip, so it draws in left to right on top of the first, which stays
 const cp2=el('clipPath',{id:'c2-'+p.id},defs);p.clip2=el('rect',{},cp2);
 const lg2=el('g',{'clip-path':'url(#c2-'+p.id+')'}),gs=s=>s.run2?lg2:lg;
 p.paths=p.series.map(s=>{const e=el('path',{fill:'none',stroke:s.color,'stroke-width':s.w,'stroke-linejoin':'round','stroke-linecap':'round'},gs(s));if(s.name){el('title',{},e).textContent=s.name}return e});
 p.dots=p.series.filter(s=>s.dots).map(s=>({s,c:s.x.map(()=>el('circle',{fill:s.color,stroke:'#fff','stroke-width':1.5},gs(s)))}));
 lg.appendChild(lg2);
}

function place(p,box,k,head){
 const [x,y,w,h]=box,fk=18*k,ft=22*k;
 p.card.setAttribute('x',x+0.5);p.card.setAttribute('y',y+0.5);p.card.setAttribute('width',w-1);p.card.setAttribute('height',h-1);
 p.tt.setAttribute('x',x+16*k);p.tt.setAttribute('y',y+36*k);p.tt.setAttribute('font-size',ft);
 const top=y+(head||84)*k,bot=y+h-62*k,left=x+(16+p.ytw+10)*k,right=x+w-34*k;
 if(p.legend){
  let cx=x+16*k;const ly=y+64*k;
  if(p.legend.items){p.lgSw.forEach((sw,i)=>{sw.setAttribute('x1',cx);sw.setAttribute('x2',cx+16*k);sw.setAttribute('y1',ly-6*k);sw.setAttribute('y2',ly-6*k);sw.setAttribute('stroke-width',3*k);cx+=24*k;
    const t=p.lgTx[i];t.setAttribute('x',cx);t.setAttribute('y',ly);t.setAttribute('font-size',fk);cx+=t.getComputedTextLength()+18*k})}
  else{p.lgSw.forEach(sw=>{sw.setAttribute('x1',cx);sw.setAttribute('x2',cx+12*k);sw.setAttribute('y1',ly-6*k);sw.setAttribute('y2',ly-6*k);sw.setAttribute('stroke-width',3.5*k);cx+=17*k});
    const t=p.lgTx[0];t.setAttribute('x',cx+6*k);t.setAttribute('y',ly);t.setAttribute('font-size',fk)}
 }
 const lo=p.y.log?Math.log(p.y.min):p.y.min,hi=p.y.log?Math.log(p.y.max):p.y.max;
 const X=v=>left+(right-left)*v/XMAX,Y=v=>bot-(bot-top)*((p.y.log?Math.log(v):v)-lo)/(hi-lo);
 p.y.ticks.forEach((v,i)=>{const yy=Y(v);const gl=p.grid[i];gl.setAttribute('x1',left);gl.setAttribute('x2',right);gl.setAttribute('y1',yy);gl.setAttribute('y2',yy);
  const t=p.yt[i];t.setAttribute('x',left-10*k);t.setAttribute('y',yy+6*k);t.setAttribute('font-size',fk)});
 XT.forEach((v,i)=>{const t=p.xt[i];t.setAttribute('x',X(v));t.setAttribute('y',bot+28*k);t.setAttribute('font-size',fk)});
 p.xl.setAttribute('x',(left+right)/2);p.xl.setAttribute('y',bot+54*k);p.xl.setAttribute('font-size',fk);
 const val=(s,j)=>s.y[j];
 p.series.forEach((s,i)=>{let d='';for(let j=0;j<s.x.length;j++)d+=(j?'L':'M')+X(s.x[j]).toFixed(1)+' '+Y(val(s,j)).toFixed(1);p.paths[i].setAttribute('d',d)});
 p.dots.forEach(({s,c})=>c.forEach((ci,j)=>{ci.setAttribute('cx',X(s.x[j]));ci.setAttribute('cy',Y(val(s,j)));ci.setAttribute('r',4.5*k)}));
 p.box={left,right,top,bot};
}
function reveal(p,f){const b=p.box;p.clip.setAttribute('x',b.left-8);p.clip.setAttribute('y',b.top-1);p.clip.setAttribute('width',Math.max(0,(b.right-b.left+16)*f));p.clip.setAttribute('height',b.bot-b.top+2)}
function reveal2(p,f){const b=p.box;p.clip2.setAttribute('x',b.left-8);p.clip2.setAttribute('y',b.top-1);p.clip2.setAttribute('width',Math.max(0,(b.right-b.left+16)*f));p.clip2.setAttribute('height',b.bot-b.top+2)}

NEW.forEach(build);MOVING.forEach(build); // the moving pair is drawn on top
probe.remove();
NEW.forEach(p=>{place(p,p.small,KS,84);reveal(p,1)});

// ---- the config chip shown with click 1 (illustrative change; see wandb-SOURCES.md)
const chip=$('chip');
{const cy=96,h=52,fs=26;
 const t1=el('text',{class:'tk','font-size':fs,y:cy+9},chip);t1.textContent='lr';
 const t2=el('text',{class:'ttl','font-size':fs,y:cy+9,'font-weight':600},chip);t2.textContent='4e-4';t2.style.fill=ORANGE;
 const t3=el('text',{class:'tk','font-size':fs,y:cy+9},chip);t3.textContent='→';
 const t4=el('text',{class:'ttl','font-size':fs,y:cy+9,'font-weight':600},chip);t4.textContent='2e-4';t4.style.fill=PAL[0];
 const ws=[t1,t2,t3,t4].map(t=>t.getComputedTextLength()),gap=12,pad=24;
 const inner=ws.reduce((a,b)=>a+b,0)+gap*3,w=inner+2*pad,x0=W/2-w/2;
 const r=el('rect',{x:x0,y:cy-h/2,width:w,height:h,rx:h/2,fill:'#f5f6f8',stroke:'#e2e4e8','stroke-width':1},chip);
 chip.insertBefore(r,chip.firstChild);
 let cx=x0+pad;
 [t1,t2,t3,t4].forEach((t,i)=>{t.setAttribute('x',cx);cx+=ws[i]+gap});
}
function chipOp(o){chip.setAttribute('opacity',o);chip.setAttribute('transform','translate(0 '+(-10*(1-o)).toFixed(2)+')');chip.style.visibility=o>0?'':'hidden'}

// ---- timeline (seconds). Click 1: chip in, then the real run (lr 2e-4, blue) draws in left to right while the
// illustrative one (lr 4e-4, orange) stays (PI 2026-10-30; mm = how much of the real run is drawn). Click 2: grid.
const C_IN=0.3,M0=0.3,M1=1.6,END1=1.65;
const MOVE=0.8,FADE0=0.55,STAG=0.1,FADE=0.3,DRAW=0.6,END2=FADE0+STAG*(NEW.length-1)+DRAW;
const REV1=0.6,REV2=0.55,ENDS=[0,END1,END2];
const clamp=v=>v<0?0:v>1?1:v,ramp=(t,a,b)=>clamp((t-a)/(b-a)),ease=r=>r<0.5?4*r*r*r:1-Math.pow(-2*r+2,3)/2;
const lerp=(a,b,m)=>a+(b-a)*m,lerpBox=(a,b,m)=>a.map((v,i)=>lerp(v,b[i],m));
const zero=()=>0,one=()=>1;
function params(step,t){ // forward into `step`, t seconds after the click
 if(step<=0)return{m:0,mm:0,chip:0,nw:zero,dr:one};
 if(step===1)return{m:0,mm:ease(ramp(t,M0,M1)),chip:ramp(t,0,C_IN),nw:zero,dr:one};
 return{m:ease(clamp(t/MOVE)),mm:1,chip:1-ramp(t,0,0.25),
  nw:i=>ramp(t,FADE0+STAG*i,FADE0+STAG*i+FADE),dr:i=>ramp(t,FADE0+STAG*i,FADE0+STAG*i+DRAW)};
}
function rparams(from,t){ // backwards from `from` to from-1
 if(from>=2)return{m:1-ease(clamp(t/REV2)),mm:1,chip:ramp(t,REV2-0.2,REV2),nw:()=>1-ramp(t,0,0.2),dr:one};
 return{m:0,mm:1-ease(ramp(t,0,REV1)),chip:1-ramp(t,0,0.2),nw:zero,dr:one};
}
function apply(P){
 MOVING.forEach(p=>{place(p,lerpBox(p.big,p.small,P.m),lerp(KB,KS,P.m),lerp(62,84,P.m));reveal(p,1);reveal2(p,P.mm)});
 chipOp(P.chip);
 NEW.forEach((p,i)=>{const o=P.nw(i);p.g.setAttribute('opacity',o);p.g.style.visibility=o>0?'':'hidden';reveal(p,P.dr(i))});
}

// ---- playback
const LAST=2,cl=s=>Math.max(0,Math.min(LAST,s|0));
let raf=0,anim=null,cur=0;
function halt(){cancelAnimationFrame(raf);raf=0;anim=null}
function settle(s){halt();cur=cl(s);apply(params(cur,ENDS[cur]))}
function tick(now){
 if(!anim)return;
 if(anim.t0===null)anim.t0=now;
 const t=Math.min((now-anim.t0)/1000,anim.dur);
 apply(anim.fwd?params(anim.to,t):rparams(anim.from,t));
 if(t>=anim.dur){const to=anim.to;anim=null;apply(params(to,ENDS[to]));return}
 raf=requestAnimationFrame(tick);
}
function play(s){
 s=cl(s);
 if(anim){const to=anim.to;halt();cur=to}
 if(s===cur+1)anim={fwd:true,from:cur,to:s,dur:ENDS[s],t0:null};
 else if(s===cur-1)anim={fwd:false,from:cur,to:s,dur:cur>=2?REV2:REV1,t0:null};
 else{settle(s);return}
 cur=s;apply(anim.fwd?params(s,0):rparams(anim.from,0));
 raf=requestAnimationFrame(tick);
}
apply(params(0,0)); // first paint = step 0 (the poster)
window.renderAt=(s,t)=>{halt();cur=cl(s);apply(params(cur,Math.max(0,+t||0)))};
if(window.deckwerk){
 deckwerk.onActive(e=>settle((e&&e.step)|0));
 deckwerk.onStep(e=>play((e&&e.step)|0));
 deckwerk.onInactive(halt);
}else{
 document.addEventListener('click',()=>{if(cur<LAST)play(cur+1);else settle(0)});
}
})();
</script>
