  while(lo<hi){const m=(lo+hi+1)>>1;r.e.textContent=s.slice(0,m).trimEnd()+'…';if(width(r.e)<=maxW)lo=m;else hi=m-1}
  r.e.textContent=s.slice(0,lo).trimEnd()+'…'}
 layoutLegend();placeHeader()}
function placeHeader(){let p=NaN,w=0;
 try{p=hdr.getStartPositionOfChar(HW[0].textContent.length).x;w=HW[1].getComputedTextLength()}catch(e){}
 if(!(w>0)||!isFinite(p)){w=width(bxT);p=cx0+24+HW[0].textContent.length*13}
 MV.dx=+(p+w/2-cx0-BX.w/2).toFixed(2)}
fitRows();

// ---- timeline (r5): one continuous entry, no clicks (window.deckSteps = 0). Seconds from the start:
//   0.0- 0.5  the model card holds; 0.5-3.3 it splits into its layers (SD = 2.8 s, half the r4 speed)
//   3.0- 5.6  the loss runs from step 450 to 514 and eases into the pause; the dashed mark and the dot come at 514
//   5.1- 5.8  the small "data batch" box glides out from under the token embedding to its place, and holds
//   6.6- 8.2  it opens into the batch card (outline grows, its label slides into the header, rows cascade down)
//   8.2-11.2  open; 11.2-12.6 it closes back into the box (the same motion, reversed); 12.6-14.1 the box holds
//  14.1-17.5  the loss runs on to 610, easing out of the pause; the box fades, the mark dims, the dot goes
//  17.0-18.9  the layers take their fit states left to right (word and "?", colour, the spiky block's hatching)
// PDF export waits 5 s after onActive, so a printed copy shows the frame 5 s in (the loss near step 504).
const clipR=$('clipR'),CL=L-6,C0=3,D0=2.6,T514=C0+D0,BOX0=T514-.5,BOXD=.7,EX0=BOX0+BOXD+.8,EXD=1.6,
 CO0=EX0+EXD+3,COD=1.4,C1=CO0+COD+1.5,D1=3.4,CF=.6,FS0=C1+D1-.5,STG=.14,SF=.55,FF=.35;
const END=FS0+(FITS.length-1)*STG+SF+.05;
// ---- the split (v2): the card holds for SH s, then over SD s each box leaves the layer it sits on
// (Token embedding and Block 1 from the first, ... Block 8 and LM head from the last) for its place in the row,
// turning from a layer into a block; the card opens out around the row and dissolves; the words, arrows and
// the chart's axes fade in as the blocks land. The curve starts at C0, as the last blocks land.
const SH=.5,SD=2.8,PILL=[0,0,1,1,1,2,2,2,3,3],PX0=MC.x-(4*MC.sw+3*MC.sg)/2;
const lerp=(a,b,u)=>a+(b-a)*u,io=u=>u<.5?4*u*u*u:1-Math.pow(2-2*u,3)/2;
const hx=c=>{c=c.length===4?'#'+[...c.slice(1)].map(d=>d+d).join(''):c;return [1,3,5].map(i=>parseInt(c.slice(i,i+2),16))};
const mix=(a,b,u)=>{if(u<=0)return a;if(u>=1)return b;const A=hx(a),B=hx(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*u).toString(16).padStart(2,'0')).join('')};
const setA=(e,a)=>{for(const k in a)e.setAttribute(k,typeof a[k]==='number'?+a[k].toFixed(2):a[k])};
const plotG=$('plot');
function split(t){const s=clamp01((t-SH)/SD);
 const ux=io(ramp(s,.1,.8)),uy=io(ramp(s,0,.75)),uw=io(ramp(s,.12,.76)),uc=ease(ramp(s,.35,.5)),uw1=s>=1?1:uw;
 boxes.forEach((b,j)=>{const x0=PX0+PILL[j]*(MC.sw+MC.sg),w=lerp(MC.sw,b.w,uw1),h=lerp(MC.sh,BH,uw1);
  const cx=lerp(x0+MC.sw/2,b.x+b.w/2,ux),cy=lerp(MC.y,CY,uy);
  setA(b.base,s>=1?{x:b.x,y:AY,width:b.w,height:BH,rx:10,fill:b.fill,stroke:b.stroke,'stroke-width':3}:
   {x:cx-w/2,y:cy-h/2,width:w,height:h,rx:lerp(MC.sw/2,10,uw),fill:mix(STONE.slab,b.fill,uc),stroke:mix(STONE.slab,b.stroke,uc),'stroke-width':3*uc});
  for(const e of b.texts)op(e,ease(ramp(s,.78,.22)))});
 // the card travels with the blocks (same centre) and opens out to frame the row
 const fw=lerp(MC.w,1621-59+36,ux),fh=lerp(MC.h,BH+36,uw),fy=lerp(MC.y,CY,uy);
 setA(mcard,{x:MC.x-fw/2,y:fy-fh/2,width:fw,height:fh,rx:lerp(MC.r,22,uw)});
 mcard.setAttribute('fill-opacity',+(1-ease(ramp(s,.05,.4))).toFixed(3));op(mcard,1-ease(ramp(s,.3,.5)));
 op(mlab,1-ease(ramp(s,0,.22)));op(conn,ease(ramp(s,.8,.2)));op(plotG,ease(ramp(s,.64,.36)));
 mdl.style.visibility=s>=1?'hidden':''}
const op=(e,v)=>e.setAttribute('opacity',v<.001?0:v>.999?1:+v.toFixed(3));
// the batch (r5): the box glides from just under the token embedding to the card's corner (growing a little, BOXD s)
// as the curve reaches the batch step and holds; then it slowly opens into the card (EXD s): the outline grows, the
// box's label slides into its place in the header while the header's other words fade in, the rows cascade down one
// after another (each dropping in from just above its slot), legend last. After 3 s open it closes by the same motion reversed (COD s).
const TE={x:boxes[0].x+boxes[0].w/2,y:AY+BH+40};
const openness=t=>t<CO0?ramp(t,EX0,EXD):1-ramp(t,CO0,COD);
function batch(t){const shown=t>=BOX0&&t<C1+CF;
 card.style.visibility=shown?'':'hidden';if(!shown)return;
 const a=ramp(t,BOX0,BOXD),landed=a>=1,p=openness(t),uo=io(ramp(p,0,.85)),um=io(ramp(p,.02,.4));
 if(landed)bx.setAttribute('transform',`translate(${+(cx0+MV.dx*um).toFixed(2)} ${+(cy0+MV.dy*um).toFixed(2)})`);
 else{const ax=io(a),sc=lerp(.7,1,ease(a)),bxX=lerp(TE.x,cx0+BX.w/2,ax)-BX.w/2*sc,bxY=lerp(TE.y,cy0+BX.h/2,ax)-BX.h/2*sc;
  bx.setAttribute('transform',`translate(${+bxX.toFixed(2)} ${+bxY.toFixed(2)}) scale(${+sc.toFixed(4)})`)}
 op(bx,ease(ramp(t,BOX0,.25)));op(bxR,landed?0:1);op(cbox,landed?1:0); // once landed, the card's outline (same place, same look) takes over
 const w=lerp(BX.w,CW,uo),h=lerp(BX.h,CHH,uo);
 setA(cbox,{width:w,height:h,stroke:mix('#b9b3a9','#d9d6cf',uo),'stroke-width':lerp(2,1,uo)});setA(cclipR,{width:w,height:h});
 const hf=ease(ramp(p,.18,.3));for(const e of [HW[0],HW[2]])e.setAttribute('fill-opacity',hf<.001?0:+hf.toFixed(3));
 rowG.forEach((r,i)=>{const p0=.14+.065*i,v=io(ramp(p,p0,.34)),dy=-.45*RH*(1-v);
  r.g.setAttribute('transform',Math.abs(dy)>.005?`translate(0 ${+dy.toFixed(2)})`:'');op(r.g,ease(ramp(p,p0,.27)))});
 op(lg,ease(ramp(p,.72,.28)));op(card,1-ease(ramp(t,C1,CF)))}
const curve=u=>clipR.setAttribute('width',u<=X0?0:X(u)-CL+1.6);
// a run's progress over D s: it speeds up over the first a s, runs steadily, and slows down over the last b s
const glide=(t,t0,D,a,b)=>{const x=t-t0;if(x<=0)return 0;if(x>=D)return 1;const v=1/(D-(a+b)/2);
 return x<a?v*x*x/(2*a):x>D-b?1-v*(D-x)*(D-x)/(2*b):v*(x-a/2)};
function frame(t){split(t);
 curve(t<C1?X0+(S-X0)*glide(t,C0,D0,.3,.5):S+(X1-S)*glide(t,C1,D1,.5,.4));
 const m=ease(ramp(t,T514-.1,.3)),r=ease(ramp(t,C1,CF));op(mark,m*(1-.75*r));op(dot,m*(1-r));
 batch(t);
 FITS.forEach((b,j)=>{const v=ease(ramp(t,FS0+j*STG,SF));op(b.lab,v);if(b.over)op(b.over,v);if(b.glow)op(b.glow,v);if(b.hatch)op(b.hatch,.5*v);if(b.halo)for(const e of b.halo)e.setAttribute('stroke-opacity',v<.001?0:+v.toFixed(3))});
 op(leg,ease(ramp(t,FS0+4.5*STG,SF)))}
// ---- playing: onActive(0) plays the entry; a step past it (the page has no click parts) plays the rest sped up
// over FF s and then holds the end. window.closerState reports where it is.
let raf=0,t0=null,tNow=0,ffFrom=null,ffAt=null;
const state=()=>{window.closerState={t:+tNow.toFixed(3),end:+END.toFixed(3),playing:!!raf,fastForward:ffFrom!==null}};
function show(t){tNow=Math.max(0,Math.min(END,t));frame(tNow);state()}
function tick(now){let t;
 if(ffFrom!==null){if(ffAt===null)ffAt=now;const x=clamp01((now-ffAt)/1000/FF);t=x>=1?END:ffFrom+(END-ffFrom)*(1-(1-x)*(1-x))}
 else{if(t0===null)t0=now-tNow*1000;t=(now-t0)/1000}
 raf=t<END?requestAnimationFrame(tick):0;if(!raf)ffFrom=null;show(t)}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;ffFrom=null;state()}
function play(){stop();t0=null;show(0);raf=requestAnimationFrame(tick);state()}
function settle(){stop();show(END)}
function finish(){if(ffFrom!==null)return;if(tNow>=END){settle();return}
 if(raf)cancelAnimationFrame(raf);ffFrom=tNow;ffAt=null;raf=requestAnimationFrame(tick);state()}
show(0);
window.deckSteps=0;
window.renderAt=(step,t)=>{stop();show((step|0)>=1||t==null?END:+t||0)};
const dw=window.deckwerk;
if(document.fonts&&document.fonts.ready){const p=document.fonts.ready.then(()=>{fitRows();frame(tNow)});if(dw&&dw.ready)dw.ready(p)}
document.addEventListener('click',()=>{if(dw)dw.next();else if(tNow<END)finish();else play()});
if(dw){
 deckwerk.onActive(e=>{const s=(e&&e.step)||0;if(s>=1)settle();else play()});
 deckwerk.onStep(e=>{const s=(e&&e.step)||0;if(s>=1)finish();else settle()});
 deckwerk.onInactive(stop);
}else play();
})();
</script></body></html>
