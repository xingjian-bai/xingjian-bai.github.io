const sm=x=>{x=clip(x,0,1);return x*x*(3-2*x)};
const inout=x=>{x=clip(x,0,1);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};

function trap(u,a=.16){u=clip(u,0,1);const v=1/(1-a);return u<a?v*u*u/(2*a):u>1-a?1-v*(1-u)*(1-u)/(2*a):v*(a/2+u-a)}
// playhead from x0 to x1: equal time per unit x, slower inside `slow` zones [a,b,speed,edge?] (soft edges)
function warp(x0,x1,slow=[],edge=0){const N=900,xs=[],ts=[0];let T=0;
 const v=x=>{let s=1;for(const [a,b,f,e2] of slow){const ed=e2==null?edge:e2,d=x<a?a-x:x>b?x-b:0;const k=ed>0?1-sm(d/ed):(d>0?0:1);s=Math.min(s,1-(1-f)*k)}return s};
 for(let i=0;i<=N;i++)xs.push(x0+(x1-x0)*i/N);
 for(let i=1;i<=N;i++){T+=(xs[i]-xs[i-1])/v((xs[i]+xs[i-1])/2);ts.push(T)}

 const L=drawLoss(pr,m,rev,lam,DY0*(1-m));svg.innerHTML='<rect width="1680" height="695" fill="white"/>'+L.svg+right+drawSentence(sent);
 window.chartState={step:s,u,epoch:pr*120,merge:m,shrink:lam,labelsEpoch:lx,entrySeconds:TL.total,click2Seconds:STEPS[2].dur/1000,decisionsShown:L.shown,result:L.result,sentence:+sent.toFixed(3),sentenceLines:SLINES,calloutFontMono:FSM,calloutLines:LINES,originalCurves:true,gapIsNotPureGeneralizationGap:true}}

// ---- click steps (DeckWerk bridge). STEPS[s].dur = ms of the move into step s (step 0: the entry).
// render(s,u): u in [0,1] through that move; render(s,1) is step s at rest.
function engine(steps,render,hurryMs=280){
 const K=steps.length-1;let cur=0,u=1,want=0,rate=0,raf=0,last=0;
 const cs=s=>Math.max(0,Math.min(K,Math.round(+s)||0));
 const stop=()=>{if(raf)cancelAnimationFrame(raf);raf=0};
 function show(s,uu){stop();cur=cs(s);want=cur;u=clip(uu,0,1);render(cur,u)}
 function start(s){stop();cur=s;u=0;const d=steps[s].dur||0;if(d<=0){u=1;render(s,1);after();return}
  rate=1/d;render(s,0);last=performance.now();raf=requestAnimationFrame(tick)}
 function tick(now){raf=0;const dt=Math.min(50,Math.max(0,now-last));last=now;u=Math.min(1,u+dt*rate);render(cur,u);if(u<1)raf=requestAnimationFrame(tick);else after()}
 function after(){if(want>cur){if(want>cur+1){cur=want-1;u=1;render(cur,1)}start(cur+1)}}
 return{K,show,stop,
  settle:s=>show(s,1),
  entry:()=>{want=0;start(0)},
  go:s=>{s=cs(s);if(s<cur){show(s,1);return}want=Math.max(want,s);
   if(raf){rate=Math.max(rate,(1-u)/hurryMs);return} // a click mid-move: finish this move quickly, then play the next
   if(u<1){u=1;render(cur,1)}after()},
  finish:()=>{stop();if(want!==cur||u<1){cur=want;u=1;render(cur,1)}},
  state:()=>({step:cur,u,want,playing:!!raf})}}
const E=engine(STEPS,render);
window.renderAt=(step,t)=>{const s=Math.max(0,Math.min(E.K,Math.round(+step)||0)),d=STEPS[s].dur||0;E.show(s,t==null||d<=0?1:t*1000/d);return window.chartState};
window.stepEngine=E;
E.show(0,0); // first paint = the start of the entry move, so the poster and the live page agree
if(window.deckwerk){
 deckwerk.onActive(e=>{const s=Math.round(+(e&&e.step))||0;if(s>0)E.settle(s);else E.entry()});
 deckwerk.onStep(e=>E.go(e&&e.step));
 deckwerk.onInactive(()=>E.finish());
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)E.finish()});
</script></html>
