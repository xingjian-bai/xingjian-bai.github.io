//   step 0 (slide enters): "Training loss ↓" and "FLORES-200, bits per sentence ↓" draw together on one training-step sweep, 3.5 s (sine ease); then the end readouts fade in (0.5 s). No clicks.
const BASE={"g0":1,"r0":0,"p0_0":0,"p0_1":0,"g1":1,"r1":0,"p1_0":0,"p1_1":0},STEPS=[[{"ch":"r0","to":1,"at":3.3,"dur":0.5},{"ch":"p0_0","to":1,"at":0,"dur":3.5,"e":"sine"},{"ch":"p0_1","to":1,"at":0,"dur":3.5,"e":"sine"},{"ch":"r1","to":1,"at":3.3,"dur":0.5},{"ch":"p1_0","to":1,"at":0,"dur":3.5,"e":"sine"},{"ch":"p1_1","to":1,"at":0,"dur":3.5,"e":"sine"}]];
const clip=(x,a,b)=>Math.max(a,Math.min(b,x));const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const fmt=x=>Math.abs(x)>=1000?(x/1000).toFixed(x%1000?1:0)+'k':Math.abs(x)<.001&&x!==0?x.toExponential(1):(+x.toFixed(Math.abs(x)<10?3:1)).toString();
const op3=v=>v<.999?' opacity="'+Math.max(0,v).toFixed(3)+'"':'';
const text=(x,y,t,c='',fill='',o=1)=>`<text x="${x}" y="${y}" class="${c}" ${fill?'style="fill:'+fill+'"':''}${op3(o)}>${esc(t)}</text>`;const textA=(x,y,t,c,anchor)=>text(x,y,t,c).replace('<text ','<text text-anchor="'+anchor+'" ');const line=(x1,y1,x2,y2,c='#d7d7d7')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1.5"/>`;function path(a,X,Y){return a.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(2)+','+Y(p[1]).toFixed(2)).join(' ')}
const EASE={sine:u=>.5-.5*Math.cos(Math.PI*u),smooth:u=>u*u*(3-2*u),linear:u=>u},POP=.03;
const XS0=Math.min(...D.panels.filter(p=>p.type!=='bars').flatMap(p=>p.series.map(r=>r.data[0][0])));
// The native slide title is gone, so the setting line is the slide's title: Avenir Next 600, ink, a bit
// larger than the 36 px panel titles. Words unchanged.
const SETTING_PX=40;
const K=STEPS.length-1,END=STEPS.map(ts=>ts.reduce((m,w)=>Math.max(m,w.at+w.dur),0));
function stateAt(s,t){const st=Object.assign({},BASE);for(let j=0;j<=s;j++){const from=Object.assign({},st);for(const w of STEPS[j]){const u=j<s?1:clip(w.dur>0?(t-w.at)/w.dur:(t>=w.at?1:0),0,1);st[w.ch]=from[w.ch]+(w.to-from[w.ch])*EASE[w.e||'smooth'](u)}}return st}
function plot(p,box,i,st){let [bx,by,bw,bh]=box;let l=bx+88,t=by+65,w=bw-130,h=bh-145;const xx=p.x||[0,D.max],yy=p.y||[0,1],log=p.log;const Y=v=>t+h-h*((log?Math.log(v):v)-(log?Math.log(yy[0]):yy[0]))/((log?Math.log(yy[1]):yy[1])-(log?Math.log(yy[0]):yy[0]));const X=v=>l+w*(v-xx[0])/(xx[1]-xx[0]);let o=text(l,by+25,p.title+(log?', log scale':''),'title');o+=`<defs><clipPath id="c${i}"><rect x="${l}" y="${t}" width="${w}" height="${h}"/></clipPath></defs>`;
let ticks=p.ticks||(log?(()=>{const c=[];for(let e=Math.floor(Math.log10(yy[0]));e<=Math.ceil(Math.log10(yy[1]));e++)for(const m of [1,2,5]){const v=m*10**e;if(v>=yy[0]*0.999&&v<=yy[1]*1.001)c.push(+v.toPrecision(6))}return c.length>5?c.filter(v=>/^1/.test(String(v))):c.length>=2?c:[yy[0],yy[1]]})():(()=>{const span=yy[1]-yy[0],mag=10**Math.floor(Math.log10(span/3)),step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=4.2);const c=[];for(let v=Math.ceil(yy[0]/step-1e-9)*step;v<=yy[1]+1e-9;v+=step)c.push(+v.toPrecision(6));return c})());for(let a of ticks){o+=line(l,Y(a),l+w,Y(a));o+=textA(l-16,Y(a)+10,fmt(a),'small','end')}for(let a of [xx[0],(xx[0]+xx[1])/2,xx[1]]){o+=line(X(a),t+h,X(a),t+h+8,'#333');o+=textA(X(a),t+h+42,fmt(a),'small','middle')}o+=textA(l+w/2,t+h+78,p.xlabel||'Training steps','small','middle');
// every panel sweeps the same training step at the same moment (XS0 = first logged step of the page);
// the end readouts (legend values, or the final-value block) fade in once the sweep is done
const span=POP*D.max,R=st['r'+i]??1;
for(let [j,r] of p.series.entries()){const P=st['p'+i+'_'+j]??1;if(!(P>0))continue;const cut=XS0+P*(D.max+span-XS0),d=r.data;let n=0;while(n<d.length&&d[n][0]<=cut)n++;if(!n)continue;const a=d.slice(0,n),c=r.color||(r.role==='agent'?blue:gray);let pd=path(a,X,Y);if(n<d.length){const A=d[n-1],B=d[n],s=(cut-A[0])/(B[0]-A[0]),xa=X(A[0]),ya=Y(A[1]);pd+=' L'+(xa+(X(B[0])-xa)*s).toFixed(2)+','+(ya+(Y(B[1])-ya)*s).toFixed(2)}
o+=`<path d="${pd}" fill="none" stroke="${c}" stroke-width="${r.role==='agent'?4:3}" ${r.dash?'stroke-dasharray="9 7"':''} clip-path="url(#c${i})"/>`;if(r.points)for(let q of a)o+=`<circle cx="${X(q[0])}" cy="${Y(q[1])}" r="6" fill="${c}" clip-path="url(#c${i})"${op3(P>=1?1:EASE.smooth(clip((cut-q[0])/span,0,1)))}><title>${esc(r.name)}: ${q[0]}, ${q[1]}</title></circle>`;
if(!p.finalValues&&R>.001){let q=a[a.length-1];o+=text(p.legendPosition==='right'?l+w-335:l+15,t+33+j*39,r.name+'  '+fmt(q[1]),'small',c,R)}}
if(p.finalValues&&R>.001){const agent=p.series.find(r=>r.role==='agent'),base=p.series.find(r=>r.role!=='agent');if(agent&&base){const av=agent.data.at(-1)[1],bv=base.data.at(-1)[1],x=l+w-340,y=t+42;o+=text(x,y,'Final FID-50K','small','',R);o+=text(x,y+44,'OPAL '+fmt(av),'title',blue,R);o+=text(x,y+85,'Recipe '+fmt(bv),'small',gray,R);o+=text(x,y+126,'Difference '+(av-bv).toFixed(3),'small',blue,R)}}
return o}
function bars(p,box,i,st){let [bx,by,bw,bh]=box,l=bx+230,t=by+72,w=bw-365,h=bh-125;let base=p.base||0,top=p.top;const X=v=>l+w*(v-base)/(top-base);let o=text(bx+30,by+25,p.title,'title');const C=st['c'+i]??1;if(p.comparison&&C>.001)o+=text(bx+bw-565,by+25,p.comparison,'small',blue,C);for(let [k,r]of p.rows.entries()){let y=t+k*h/p.rows.length,c=r.agent?blue:gray,G=st['b'+i+'_'+k]??1,L=st['l'+i+'_'+k]??1,V=st['v'+i+'_'+k]??1,bw2=w*(r.value-base)/(top-base)*G;o+=text(bx+15,y+31,r.label,'small','',L);o+=`<rect x="${l}" y="${y}" width="${Math.max(0,bw2)}" height="36" fill="${c}"/>`;if(V>.001)o+=text(l+bw2+10,y+30,r.text||fmt(r.value),'small',c,V)}const ay=t+h+4;o+=line(l,ay,l+w,ay,'#666');for(const v of [base,(base+top)/2,top]){const x=X(v);o+=line(x,ay,x,ay+8,'#666');o+=text(x-20,ay+35,fmt(v),'small')}o+=text(l,ay+72,p.unit,'small');return o}
// A panel title wider than the frame is drawn smaller rather than cut off (words unchanged).
const fitCache=new Map();function fitTitles(){for(const el of svg.querySelectorAll('text.title')){const key=el.getAttribute('x')+'|'+el.textContent;let sz=fitCache.get(key);if(sz===undefined){const x=+el.getAttribute('x'),len=el.getComputedTextLength(),room=1680-10-x;sz=len>room&&len>0?Math.floor(360*room/len)/10:0;fitCache.set(key,sz)}if(sz)el.style.fontSize=sz+'px'}}
let cur=0,ct=0,target=0,raf=0,last=0;
function draw(st){let a='<rect width="1680" height="695" fill="white"/>';if(D.setting)a+=`<text x="45" y="44" class="setting" style="font:600 ${SETTING_PX}px 'Avenir Next',Arial;fill:#191918">${esc(D.setting)}</text>`;let ps=D.panels;for(let [i,p]of ps.entries()){let box=ps.length===1?[30,85,1620,545]:ps.length===2?[i*830+15,85,820,545]:[(i%2)*830+15,80+Math.floor(i/2)*290,820,280];const g=st['g'+i]??1,inner=p.type==='bars'?bars(p,box,i,st):plot(p,box,i,st);a+=g<.999?`<g opacity="${g.toFixed(3)}">${inner}</g>`:inner}svg.innerHTML=a;fitTitles();document.getElementById('seek').value=Math.round(1000*(cur+(END[cur]?ct/END[cur]:1))/(K+1));document.getElementById('readout').textContent='Step '+cur+' of '+K;window.chartState={step:cur,t:ct,target,steps:K,playing:!!raf,source:D.source,observedOnly:true}}
const CATCH=.3;let rush=false,guard=0;function speed(s){return s<target||rush?Math.max(3,END[s]/CATCH):1}
function show(){draw(stateAt(cur,ct))}
function halt(){if(raf)cancelAnimationFrame(raf);raf=0;last=0;rush=false;clearTimeout(guard)}
function settle(s){halt();cur=target=clip(s|0,0,K);ct=END[cur];show()}
function tick(ts){raf=0;const dt=last?Math.min((ts-last)/1000,.25):0;last=ts;let r=dt;for(;;){if(ct>=END[cur]){if(cur<target){cur++;ct=0;continue}break}const sp=speed(cur),need=(END[cur]-ct)/sp;if(r>=need){r-=need;ct=END[cur];continue}ct+=r*sp;break}if(cur<target||ct<END[cur])raf=requestAnimationFrame(tick);else{last=0;rush=false;clearTimeout(guard)}show()}
function go(s){s=s|0;if(s>K){if(raf)rush=true;s=K}s=clip(s,0,K);if(s<cur){settle(s);return}target=s;if(!raf&&(cur<target||ct<END[cur])){last=0;raf=requestAnimationFrame(tick)}}
window.renderAt=(step,t)=>{halt();cur=target=clip(step|0,0,K);ct=t==null?END[cur]:clip(+t||0,0,END[cur]);show();return window.chartState};
// the entry build also settles on a timer, so a PDF stage is drawn even if animation frames are throttled
function enter(){halt();cur=target=0;ct=0;show();if(END[0]>0){raf=requestAnimationFrame(tick);guard=setTimeout(()=>{if(cur<target||ct<END[cur])settle(cur)},(END[0]+.4)*1000)}}
function advance(){if(cur===target&&ct<END[cur]){if(!raf){last=0;raf=requestAnimationFrame(tick)}}else go(Math.max(cur,target)+1)}
document.getElementById('play').onclick=advance;document.getElementById('reset').onclick=()=>{halt();cur=target=0;ct=0;show()};document.getElementById('seek').oninput=e=>settle(Math.round(+e.target.value/1000*K));
const fontsReady=document.fonts&&document.fonts.ready?document.fonts.ready.then(()=>{fitCache.clear();show()}):null;
if(window.deckwerk){deckwerk.onActive(e=>{const s=(e&&e.step)|0;if(s<=0)enter();else settle(s)});deckwerk.onStep(e=>go(e&&e.step));deckwerk.onInactive(halt);if(fontsReady&&deckwerk.ready)deckwerk.ready(fontsReady)}
else{document.addEventListener('click',advance);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')advance();else if(e.key==='ArrowLeft'||e.key==='PageUp')settle(Math.max(cur,target)-1)})}
halt();cur=target=0;ct=0;show();
</script></html>
