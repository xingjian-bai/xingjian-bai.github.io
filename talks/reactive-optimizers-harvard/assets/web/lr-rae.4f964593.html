// the four-line box of an event, in the column right of the chart
function boxCol(e,hop,rows){const ev=EV[e],B=BOXES[e];let g='';if(Math.max(hop,...rows)<=0.001)return'';
 let y=BY0;if(hop>0.001)g+=`<g opacity="${hop.toFixed(3)}">`+circ(BX0+18.5,y+18.5,ev.num,18.5)+tx(BX0+51,y+29,ev.title,` style="font-size:${BT}px;font-weight:600;fill:${INK}"`)+'</g>';
 y+=77;B.forEach((it,i)=>{const op=rows[i];
  if(op>0.001){g+=`<g opacity="${op.toFixed(3)}">`+tx(BX0,y+23,it.lab,` class="mono" style="font-size:${BL}px;fill:${MUTED}"`);it.lines.forEach((ln,j)=>{g+=lineTxt(BX0,y+61+j*BLH,ln)});g+='</g>'}
  y+=61+(it.lines.length-1)*BLH+BG});
 return g}

// ---------------- render ----------------
let cur=0,anim=null,raf=0,last=0,poster=true;
function render(st,dt,snap){CAP=st.s>0.5?'round':'butt';
 const sc=scale(st.rect,st.lx,st.ly,st.c),[l,t,r,b]=st.rect,s=st.s;let g='';
 const cg=mix(GRID,'#efefef',s),cg1=mix(GRID1,'#e6e6e6',s),ca=mix(AXIS,'#e6e6e6',s),gw=lerp(1.5,K,s);
 const cx0=l-2*K*s,cy0=t-lerp(10,6*K,s),cx1=r+2*K*s,cy1=b;
 g+=`<defs><clipPath id="cm"><rect x="${f1(cx0)}" y="${f1(cy0)}" width="${f1(cx1-cx0)}" height="${f1(cy1-cy0)}"/></clipPath></defs>`;
 // grid: the big chart's ticks give way to the blog panel's
 const YU=[...new Set([...YT_MAIN,...SITP.yt])];
 for(const v of YU){const op=Math.max(YT_MAIN.includes(v)?1-s:0,SITP.yt.includes(v)?s:0);if(op>0.001){const y=sc.Y(v);if(y>=t-1&&y<=b+1)g+=`<g opacity="${op.toFixed(3)}">${hl(l,r,y,v===1?cg1:cg,gw)}</g>`}}
 g+=hl(l,r,b,ca,gw);
 // value guides of the event views: label positions (nudged apart), then the regular labels they cover fade
 const GL=[];EV.forEach((ev,e)=>ev.guides.forEach((G,j)=>{const op=st.gd[e][j];if(op>0.001)GL.push({v:G[0],at:G[1],col:COL[G[2]],lab:G[3],op,y:sc.Y(G[0])})}));
 GL.sort((a,b)=>a.y-b.y);const gy=GL.map(o=>o.y);for(let i=1;i<gy.length;i++)if(gy[i]-gy[i-1]<23)gy[i]=gy[i-1]+23;
 if(st.mainTicks>0.001)for(const v of YT_MAIN){const y=sc.Y(v),hide=GL.reduce((m,o,i)=>Math.abs(gy[i]-y)<24?Math.max(m,o.op):m,0),op=st.mainTicks*(1-hide);
  if(op>0.001&&y>=t-2&&y<=b+2)g+=tx(l-14,y+8,fmtY(v),` text-anchor="end" opacity="${op.toFixed(3)}" style="font-size:24px;fill:${MUTED}"`)}
 GL.forEach((o,i)=>{const X=sc.X(o.at);if(X>l+3)g+=`<line x1="${f1(l)}" x2="${f1(X)}" y1="${f1(o.y)}" y2="${f1(o.y)}" stroke="${o.col}" stroke-width="2" stroke-dasharray="7 6" opacity="${(0.5*o.op).toFixed(3)}"/>`;
  g+=tx(l-14,gy[i]+8,o.lab,` text-anchor="end" opacity="${o.op.toFixed(3)}" style="font-size:22px;fill:${o.col}"`)});
 // the blog panel's tick labels (last stage)
 if(st.smallTicks>0.001){let h='';for(const v of SITP.yt)h+=tickT(l-5*K,sc.Y(v)+0.32*FT*K,fmtY(v),'end');
  h+=xTickLabels(xTicksBlog(sc,T),v=>fmtK(v),sc.X,l,b)+tickT(r,b+XTB*K,'Training steps','end');
  g+=`<g opacity="${st.smallTicks.toFixed(3)}">${h}</g>`}
 // x ticks of the big chart (fade in and out as the range changes; a centred label is kept within the chart's ends)
 const sel=st.mainTicks>0.001?xTicks(sc,140):[];tickAlphas(sel,dt||0,snap);
 if(st.mainTicks>0.001)for(const [v,a] of tickA){const X=sc.X(v);if(X<l-1||X>r+1)continue;const o=(a*st.mainTicks).toFixed(3),tl=fmtC(v),hw=tw(tl,F24)/2,an=X-l<2?'start':r-X<2?'end':'middle';
  g+=`<line x1="${f1(X)}" x2="${f1(X)}" y1="${f1(b)}" y2="${f1(b+8)}" stroke="${AXIS}" stroke-width="1.5" opacity="${o}"/>`+tx(an==='middle'?clamp(X,l+hw,r-hw):X,b+38,tl,` text-anchor="${an}" opacity="${o}" style="font-size:24px;fill:${MUTED}"`)}
 // axis break at step 1,000 (overview stages)
 const bo=brkOf(st.c)*st.mainTicks;if(bo>0.001){const X=sc.X(1000);if(X>l+2&&X<r-2)
  g+=`<g opacity="${bo.toFixed(3)}"><rect x="${f1(X-6)}" y="${f1(b-7)}" width="12" height="14" fill="#fff"/><line x1="${f1(X-9)}" x2="${f1(X-1)}" y1="${f1(b+9)}" y2="${f1(b-9)}" stroke="${MUTED}" stroke-width="2"/><line x1="${f1(X+1)}" x2="${f1(X+9)}" y1="${f1(b+9)}" y2="${f1(b-9)}" stroke="${MUTED}" stroke-width="2"/></g>`}
 if(st.xlab>0.001)g+=tx((l+r)/2,b+84,'Training steps',` text-anchor="middle" opacity="${st.xlab.toFixed(3)}" style="font-size:24px;fill:${MUTED}"`);
 if(st.ylab>0.001)g+=`<text transform="translate(38 ${f1((t+b)/2)}) rotate(-90)" text-anchor="middle" opacity="${st.ylab.toFixed(3)}" style="font-size:24px;fill:${MUTED}">Learning-rate multiplier</text>`;
 // lines: official recipe, ghost of what is to come, the part fading out, the replayed part
 const W=WBIG.map((w,i)=>lerp(w,WSMALL[i],s)),order=[3,2,1,0];
 g+='<g clip-path="url(#cm)">';
 if(st.off>0.001)g+=lineSvg(D.official,sc,-1,st.offTo,OFFC,OFFW,st.off);
 if(st.ghost>0.001)for(const i of order)g+=lineSvg(D.groups[i],sc,st.reveal,9,COL[i],W[i],st.ghost);
 if(st.fade&&st.fade.op>0.001)for(const i of order)g+=lineSvg(D.groups[i],sc,st.fade.a,st.fade.b,COL[i],W[i],st.fade.op);
 for(const i of order)g+=lineSvg(D.groups[i],sc,-1,st.reveal,COL[i],W[i],1);
 if(st.tips>0.001){const u=P10(st.reveal);for(const i of order){const X=sc.X(u),Y=sc.Y(valAt(D.groups[i],u));if(Y<=b)g+=`<circle cx="${f1(X)}" cy="${f1(Y)}" r="${(W[i]/2+3.5).toFixed(1)}" fill="${COL[i]}" opacity="${st.tips.toFixed(3)}"/>`}}
 g+='</g>';
 // curves that leave the 0.05x floor: a small arrow where they go below
 const dn=st.mainTicks*(1-s);if(dn>0.001)for(const [gi,u] of D.below){if(lg(u)>st.reveal+1e-9)continue;const X=sc.X(u);if(X<l||X>r)continue;
  g+=`<g opacity="${dn.toFixed(3)}"><line x1="${f1(X)}" x2="${f1(X)}" y1="${f1(b-26)}" y2="${f1(b-10)}" stroke="${COL[gi]}" stroke-width="2.5"/><path d="M${f1(X-6)},${f1(b-12)}L${f1(X+6)},${f1(b-12)}L${f1(X)},${f1(b-2)}Z" fill="${COL[gi]}"/></g>`}
 // decision ticks of the SiT-B/2 panel (last stage)
 if(st.mainDec>0.001){let h='';for(const u of SITP.ticks)h+=vl(sc.X(u),t-6*K,t+1*K,RED,1.5*K);g+=`<g opacity="${st.mainDec.toFixed(3)}">${h}</g>`}
 // event markers: circled number and step
 EV.forEach((ev,e)=>{const op=st.mk[e];if(op<=0.001)return;const X=sc.X(ev.x);if(X<l-2||X>r+2)return;
  const w=tw(ev.label,F24),right=X+48+w<=r,cx=right?X+24:X-24;
  g+=`<g opacity="${op.toFixed(3)}">`+vl(X,t-6,b,RED,2.5)+circ(cx,t-24,ev.num)+tx(right?X+46:X-46,t-15,ev.label,` text-anchor="${right?'start':'end'}" style="font-size:24px;fill:${RED}"`)+'</g>'});
 if(st.mkAll>0.001)EV.forEach(ev=>{const X=sc.X(ev.x);g+=`<g opacity="${st.mkAll.toFixed(3)}"><line x1="${f1(X)}" x2="${f1(X)}" y1="${f1(t-10)}" y2="${f1(b)}" stroke="${RED}" stroke-width="2" opacity="0.85"/>`+circ(X,t-24,ev.num)+'</g>'});
 // the boxes, the result note, the legend and the example label
 EV.forEach((ev,e)=>{g+=boxCol(e,st.hd[e],st.box[e])});
 if(st.fid>0.001)g+=tx(l+20,b-24,D.fid,` opacity="${st.fid.toFixed(3)}" style="font-size:22px;fill:#8a8a86"`);
 if(st.legend>0.001){let x=l,y=38,h='';
  D.legend.forEach((s2,i)=>{const off=i===D.legend.length-1;h+=off?`<line x1="${x}" x2="${x+40}" y1="${y-8}" y2="${y-8}" stroke="${OFFC}" stroke-width="6" opacity="0.35"/>`:`<line x1="${x}" x2="${x+40}" y1="${y-8}" y2="${y-8}" stroke="${COL[i]}" stroke-width="5"/>`;
   h+=tx(x+50,y,s2,` style="font-size:24px;fill:${TXT}"`);x+=50+tw(s2,F24)+36});
  h+=tx(l,66,D.example,` style="font-size:20px;fill:#8a8a86"`);
  g+=`<g opacity="${st.legend.toFixed(3)}">${h}</g>`}
 // last stage: the SiT-B/2 panel's head, name and legend, then the blog's other four panels
 if(st.mainTitle>0.001)g+=`<g opacity="${st.mainTitle.toFixed(3)}">${blogText(SITP,blogBox(SITP))}</g>`;
 st.panels.forEach((p,i)=>{if(p.op<=0.001)return;const P=OTHERS[i],L=blogBox(P),c=[bx(L.x0+L.w/2),by(L.big?175:ROW2+120)];
  g+=`<g opacity="${p.op.toFixed(3)}" transform="translate(${f1(c[0])} ${f1(c[1])}) scale(${p.sc.toFixed(4)}) translate(${f1(-c[0])} ${f1(-c[1])})">${blogText(P,L)}${blogPlot(P,L)}</g>`});
 svg.innerHTML=g;
 window.lrState={stage:cur,animating:!!anim};
}

// ---------------- stage control ----------------
function stop(){cancelAnimationFrame(raf);anim=null}
function settle(k){stop();poster=false;cur=clamp(k|0,0,NST-1);render(settled(cur),0,true)}
function tick(ts){if(!anim)return;if(!last)last=ts;const dt=Math.min(0.05,(ts-last)/1000);last=ts;anim.t+=dt;
 if(anim.t>=anim.plan.dur){anim=null;render(settled(cur),0,true);return}
 render(anim.plan.at(anim.t),dt,false);raf=requestAnimationFrame(tick)}
function go(k){k=clamp(k|0,0,NST-1);poster=false;if(anim)settle(cur);if(k===cur){settle(k);return}
 const plan=k===cur+1?forward(k):quick(settled(cur),settled(k),0.8);cur=k;anim={plan,t:0};last=0;
 render(plan.at(0),0,false);raf=requestAnimationFrame(tick)}
// stage 0's entry (onActive at step 0, or on load without a bridge); its first frame, empty axes, is also the poster
function enter(){stop();poster=false;cur=0;const plan=forward(0);anim={plan,t:0};last=0;render(plan.at(0),0,true);raf=requestAnimationFrame(tick)}
// deterministic frame for checks: stage k's transition at time t (k = 0: the entry), or its settled state
window.renderAt=(k,t)=>{if(t==null){settle(k);return window.lrState}settle(k-1);cur=clamp(k,0,NST-1);const plan=forward(cur);
 for(let x=0;x<t;x+=1/60)render(plan.at(x),1/60,false);render(plan.at(t),1/60,false);return window.lrState};
window.lrStages=NST;
render(forward(0).at(0),0,true);
const fontsReady=(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{layoutBoxes();if(!anim)render(poster?forward(0).at(0):settled(cur),0,true);if(!window.deckwerk)enter()});
if(window.deckwerk){
 deckwerk.onActive(e=>{const k=e&&typeof e.step==='number'?e.step:0;if(k>0)settle(k);else enter()});
 deckwerk.onStep(e=>{const k=e&&typeof e.step==='number'?e.step:cur+1;go(k)});
 deckwerk.onInactive(()=>{if(anim)settle(cur)});
 if(typeof deckwerk.ready==='function')deckwerk.ready(fontsReady)}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&anim)settle(cur)});
})();
</script></body></html>
